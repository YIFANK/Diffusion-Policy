# config.yaml
model:
  obs_horizon: 2
  pred_horizon: 16
  action_dim: 2
  action_horizon: 8
  num_diffusion_iters: 100

training:
  epochs: 5000
  batch_size: 64
  learning_rate: 1e-4
  weight_decay: 1e-6

data:
  left_path: "../output/save_data/left.pkl"
  right_path: "../output/save_data/right.pkl"
  embeddings_path: "../output/save_data/embeddings.npy"